<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameHub — Playable Browser Games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a14;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:30px 15px;background:radial-gradient(circle at 50% 0,#273b88,#120d28 65%);border-bottom:1px solid #2d3961}
h1{font-size:42px;margin:0 0 8px}header p{opacity:.75;margin:0}
.tools{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:13px;background:#0e1527ee;backdrop-filter:blur(8px);border-bottom:1px solid #273252}
input,select,.action{font:inherit;padding:11px 13px;border-radius:11px}input,select{background:#19233d;color:#fff;border:1px solid #35456f}.action{background:#6578ff;color:#fff;border:0;font-weight:bold;cursor:pointer}
#count{max-width:1150px;margin:18px auto 5px;padding:0 14px;opacity:.65}
#grid{max-width:1150px;margin:12px auto 30px;padding:0 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:11px}
.game-card{min-height:135px;border:1px solid #29385f;border-radius:15px;background:linear-gradient(145deg,#151e35,#10172a);color:#fff;padding:15px;text-align:left;cursor:pointer;transition:.15s}
.game-card:hover{transform:translateY(-3px);border-color:#7f8fff;box-shadow:0 8px 25px #0008}.game-card span{font-size:32px}.game-card strong{display:block;margin-top:9px;font-size:16px}.game-card small{display:block;margin-top:5px;opacity:.55}
#gamePanel{display:none;max-width:950px;margin:20px auto;padding:15px;background:#11192c;border:1px solid #30406c;border-radius:17px}
#gamePanel.active{display:block}#gameCanvas{display:block;width:100%;height:auto;background:#05070d;border-radius:12px;touch-action:none}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}#help{text-align:center;opacity:.7;font-size:13px}
@media(max-width:600px){h1{font-size:31px}#grid{grid-template-columns:repeat(2,1fr);gap:8px}.game-card{min-height:120px}}
</style></head><body>
<header><h1>🎮 GameHub</h1><p>Playable browser games • every card opens a matching game</p></header>
<div class="tools"><input id="search" placeholder="🔎 Search games"><select id="category"><option>All</option><option>Action</option><option>Arcade</option><option>Idle</option><option>Platformer</option><option>Puzzle</option><option>Racing</option><option>Sports</option></select><button id="random" class="action">🎲 Random Game</button></div>
<div id="count">30 games</div><div id="grid"><button class="game-card" data-game="0"><span>🟣</span><strong>Slope</strong><small>Arcade</small></button><button class="game-card" data-game="1"><span>🟦</span><strong>OvO-style Platformer</strong><small>Platformer</small></button><button class="game-card" data-game="2"><span>🍪</span><strong>Cookie Clicker</strong><small>Idle</small></button><button class="game-card" data-game="3"><span>🏍️</span><strong>Moto Hill Ride</strong><small>Racing</small></button><button class="game-card" data-game="4"><span>🐍</span><strong>Snake</strong><small>Arcade</small></button><button class="game-card" data-game="5"><span>🐦</span><strong>Flappy Bird-style</strong><small>Arcade</small></button><button class="game-card" data-game="6"><span>🏎️</span><strong>Drift Racer</strong><small>Racing</small></button><button class="game-card" data-game="7"><span>🚀</span><strong>Space Shooter</strong><small>Action</small></button><button class="game-card" data-game="8"><span>🏀</span><strong>Basketball Shot</strong><small>Sports</small></button><button class="game-card" data-game="9"><span>🧱</span><strong>Breakout</strong><small>Arcade</small></button><button class="game-card" data-game="10"><span>⚡</span><strong>Dodge Blocks</strong><small>Arcade</small></button><button class="game-card" data-game="11"><span>🌈</span><strong>Tunnel Rush</strong><small>Arcade</small></button><button class="game-card" data-game="12"><span>🏃</span><strong>Endless Runner</strong><small>Platformer</small></button><button class="game-card" data-game="13"><span>🛡️</span><strong>Tank Battle</strong><small>Action</small></button><button class="game-card" data-game="14"><span>🫧</span><strong>Bubble Shooter</strong><small>Puzzle</small></button><button class="game-card" data-game="15"><span>🧠</span><strong>Memory Match</strong><small>Puzzle</small></button><button class="game-card" data-game="16"><span>🔢</span><strong>2048</strong><small>Puzzle</small></button><button class="game-card" data-game="17"><span>👆</span><strong>Click Speed Test</strong><small>Arcade</small></button><button class="game-card" data-game="18"><span>💨</span><strong>Avoider</strong><small>Arcade</small></button><button class="game-card" data-game="19"><span>⛳</span><strong>Mini Golf</strong><small>Sports</small></button><button class="game-card" data-game="20"><span>🏓</span><strong>Pong</strong><small>Arcade</small></button><button class="game-card" data-game="21"><span>❌</span><strong>Tic Tac Toe</strong><small>Puzzle</small></button><button class="game-card" data-game="22"><span>🎨</span><strong>Color Match</strong><small>Puzzle</small></button><button class="game-card" data-game="23"><span>💥</span><strong>Brick Breaker</strong><small>Arcade</small></button><button class="game-card" data-game="24"><span>🚁</span><strong>Helicopter</strong><small>Arcade</small></button><button class="game-card" data-game="25"><span>🛸</span><strong>Cave Flyer</strong><small>Arcade</small></button><button class="game-card" data-game="26"><span>🏁</span><strong>Platform Dash</strong><small>Platformer</small></button><button class="game-card" data-game="27"><span>🎯</span><strong>Target Shooter</strong><small>Action</small></button><button class="game-card" data-game="28"><span>🪙</span><strong>Coin Catcher</strong><small>Arcade</small></button><button class="game-card" data-game="29"><span>⚡</span><strong>Reaction Test</strong><small>Arcade</small></button></div>
<div style="max-width:1150px;margin:0 auto 10px;padding:0 14px;opacity:.55;font-size:12px;text-align:center">Original browser-game implementations with matching mechanics; not copies of copyrighted game files.</div><section id="gamePanel"><div class="row"><strong id="gameTitle">Game</strong><button id="back" class="action">← Back</button></div><canvas id="gameCanvas" width="900" height="520"></canvas><p id="help"></p></section>
<script>
const GAMES=[("Slope", "Arcade", "slope", "🟣"), ("OvO-style Platformer", "Platformer", "platform", "🟦"), ("Cookie Clicker", "Idle", "cookie", "🍪"), ("Moto Hill Ride", "Racing", "moto", "🏍️"), ("Snake", "Arcade", "snake", "🐍"), ("Flappy Bird-style", "Arcade", "flappy", "🐦"), ("Drift Racer", "Racing", "race", "🏎️"), ("Space Shooter", "Action", "shooter", "🚀"), ("Basketball Shot", "Sports", "basket", "🏀"), ("Breakout", "Arcade", "breakout", "🧱"), ("Dodge Blocks", "Arcade", "dodge", "⚡"), ("Tunnel Rush", "Arcade", "tunnel", "🌈"), ("Endless Runner", "Platformer", "runner", "🏃"), ("Tank Battle", "Action", "tank", "🛡️"), ("Bubble Shooter", "Puzzle", "bubble", "🫧"), ("Memory Match", "Puzzle", "memory", "🧠"), ("2048", "Puzzle", "game2048", "🔢"), ("Click Speed Test", "Arcade", "clickgame", "👆"), ("Avoider", "Arcade", "avoider", "💨"), ("Mini Golf", "Sports", "golf", "⛳"), ("Pong", "Arcade", "pong", "🏓"), ("Tic Tac Toe", "Puzzle", "ttt", "❌"), ("Color Match", "Puzzle", "color", "🎨"), ("Brick Breaker", "Arcade", "breakout", "💥"), ("Helicopter", "Arcade", "heli", "🚁"), ("Cave Flyer", "Arcade", "heli", "🛸"), ("Platform Dash", "Platformer", "runner", "🏁"), ("Target Shooter", "Action", "shooter", "🎯"), ("Coin Catcher", "Arcade", "catchgame", "🪙"), ("Reaction Test", "Arcade", "reaction", "⚡")];
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const panel=document.getElementById("gamePanel");
const title=document.getElementById("gameTitle");
const help=document.getElementById("help");
let animation=0, keys={}, cleanup=()=>{};
document.querySelectorAll(".game-card").forEach(btn=>{
  btn.addEventListener("click",()=>openGame(Number(btn.dataset.game)));
});
document.getElementById("search").addEventListener("input",filter);
document.getElementById("category").addEventListener("change",filter);
document.getElementById("random").addEventListener("click",()=>openGame(Math.floor(Math.random()*GAMES.length)));
document.getElementById("back").addEventListener("click",closeGame);
window.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

function filter(){
 const q=document.getElementById("search").value.toLowerCase();
 const cat=document.getElementById("category").value;
 document.querySelectorAll(".game-card").forEach(b=>{
   const g=GAMES[Number(b.dataset.game)];
   b.hidden=!!(q && !g[0].toLowerCase().includes(q)) || !(cat==="All"||g[1]===cat);
 });
}
function clearGame(){
 cancelAnimationFrame(animation); cleanup(); cleanup=()=>{};
 ctx.clearRect(0,0,900,520);
}
function openGame(i){
 clearGame();
 const g=GAMES[i];
 title.textContent=g[0]; panel.classList.add("active");
 ({
slope,platform:ovo,cookie,moto,snake,flappy,race:racing,shooter,basket,breakout,dodge,tunnel,runner,tank,bubble,
memory,game2048:game2048,clickgame:clickgame,avoider, golf, pong, ttt, color, heli, catchgame, reaction
}[g[2]]||slope)();
 panel.scrollIntoView({behavior:"smooth",block:"start"});
}
function closeGame(){clearGame();panel.classList.remove("active")}
function bg(c="#08101f"){ctx.fillStyle=c;ctx.fillRect(0,0,900,520)}
function text(t,x,y,size=24){ctx.fillStyle="#fff";ctx.font=`${size}px Arial`;ctx.fillText(t,x,y)}
function loop(fn){function f(t){fn(t);animation=requestAnimationFrame(f)}animation=requestAnimationFrame(f)}
function buttonHint(s){help.textContent=s}
function slope(){
 buttonHint("A/D or ←/→ to steer • Keep the ball on the track");
 let x=450,y=120,vx=0,vy=2,score=0;
 loop(t=>{bg("#071124");vx+=(keys.a||keys.arrowleft?-0.35:0)+(keys.d||keys.arrowright?0.35:0);vx*=.97;vy+=.15;x+=vx;y+=vy;score++;
 ctx.strokeStyle="#55eaff";ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(0,400);
 for(let i=0;i<19;i++)ctx.lineTo(i*50,360+Math.sin(i+t/400)*42);ctx.stroke();
 ctx.fillStyle="#ff54dd";ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();text("Score: "+score,20,35);
 if(y>520||x<0||x>900){x=450;y=100;vx=0;vy=2;score=0}});
}
function ovo(){
 buttonHint("A/D or ←/→ move • W/↑ jump");
 let x=70,y=420,v=0,on=false;
 loop(()=>{bg("#0b1630");if(keys.a||keys.arrowleft)x-=4;if(keys.d||keys.arrowright)x+=4;
 if((keys.w||keys.arrowup)&&on){v=-11;on=false}v+=.5;y+=v;if(y>420){y=420;v=0;on=true}
 ctx.fillStyle="#5ce1ed";ctx.fillRect(0,455,900,65);
 for(let i=0;i<8;i++){ctx.fillStyle=i%2?"#586dff":"#ff59dc";ctx.fillRect(100+i*110,410-(i%3)*65,75,18)}
 ctx.fillStyle="#fff";ctx.fillRect(x,y-42,28,42);if(x>850)x=70});
}
function cookie(){
 buttonHint("Click the cookie • Press C to buy a cursor");
 let n=0,cursors=0;
 const click=()=>n++;
 canvas.addEventListener("click",click);cleanup=()=>canvas.removeEventListener("click",click);
 const key=e=>{if(e.key.toLowerCase()==="c"&&n>=15){n-=15;cursors++}};
 window.addEventListener("keydown",key);cleanup=()=>{canvas.removeEventListener("click",click);window.removeEventListener("keydown",key)};
 loop(()=>{bg();text("🍪",390,280,105);text("Cookies: "+Math.floor(n),345,70,30);text("Cursors: "+cursors,370,450,22);n+=cursors*.015});
}
function moto(){
 buttonHint("D/→ accelerate • A/← brake");
 let x=100,y=380,v=0;
 loop(()=>{bg("#13233a");if(keys.d||keys.arrowright)x+=5;if(keys.a||keys.arrowleft)x-=2;v+=.45;y+=v;if(y>380){y=380;v=-6}
 ctx.fillStyle="#61d46d";ctx.beginPath();ctx.moveTo(0,420);for(let i=0;i<19;i++)ctx.lineTo(i*50,390+Math.sin(i+x/80)*28);ctx.lineTo(900,520);ctx.lineTo(0,520);ctx.fill();
 ctx.fillStyle="#ff4c68";ctx.fillRect(x-28,y-12,56,14);ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x-20,y+5,11,0,7);ctx.arc(x+20,y+5,11,0,7);ctx.fill();if(x>920)x=0;if(x<-20)x=920});
}
function snake(){
 buttonHint("Arrow keys • Eat the red square");
 let body=[{x:10,y:10}],dir={x:1,y:0},food={x:20,y:10},last=0;
 const key=e=>{if(e.key==="ArrowUp"&&dir.y===0)dir={x:0,y:-1};if(e.key==="ArrowDown"&&dir.y===0)dir={x:0,y:1};if(e.key==="ArrowLeft"&&dir.x===0)dir={x:-1,y:0};if(e.key==="ArrowRight"&&dir.x===0)dir={x:1,y:0}};
 window.addEventListener("keydown",key);cleanup=()=>window.removeEventListener("keydown",key);
 loop(t=>{if(t-last<100)return;last=t;let h={x:body[0].x+dir.x,y:body[0].y+dir.y};
 if(h.x<0||h.x>=30||h.y<0||h.y>=20||body.some(p=>p.x===h.x&&p.y===h.y)){body=[{x:10,y:10}];dir={x:1,y:0};return}
 body.unshift(h);if(h.x===food.x&&h.y===food.y)food={x:Math.floor(Math.random()*30),y:Math.floor(Math.random()*20)};else body.pop();
 bg();ctx.fillStyle="#54e28a";body.forEach(p=>ctx.fillRect(p.x*30,p.y*26,27,23));ctx.fillStyle="#ff4d68";ctx.fillRect(food.x*30,food.y*26,27,23)});
}
function flappy(){
 buttonHint("Space or click to flap");
 let y=250,v=0;
 const flap=()=>v=-7;canvas.addEventListener("click",flap);cleanup=()=>canvas.removeEventListener("click",flap);
 loop(()=>{bg("#62c9e7");if(keys[" "]){v=-7;keys[" "]=false}v+=.35;y+=v;
 ctx.fillStyle="#ffd34d";ctx.beginPath();ctx.arc(160,y,19,0,7);ctx.fill();
 let x=900-(Date.now()/5)%1100;ctx.fillStyle="#45a95a";ctx.fillRect(x,0,60,170);ctx.fillRect(x,350,60,170);if(y<0||y>520)y=250});
}
function racing(){
 buttonHint("A/D or ←/→ steer");
 let x=450;
 loop(()=>{bg("#11151d");ctx.fillStyle="#303742";ctx.fillRect(130,0,640,520);ctx.fillStyle="#fff";
 for(let y=-30;y<540;y+=90)ctx.fillRect(445,y,10,50);if(keys.a||keys.arrowleft)x-=6;if(keys.d||keys.arrowright)x+=6;x=Math.max(155,Math.min(745,x));
 ctx.fillStyle="#ff5065";ctx.fillRect(x-25,400,50,75)});
}
function shooter(){
 buttonHint("A/D move • Space shoots");
 let x=450,shots=[],enemies=[];
 loop(()=>{bg();if(keys.a)x-=5;if(keys.d)x+=5;if(keys[" "]){shots.push({x,y:440});keys[" "]=false}
 if(Math.random()<.025)enemies.push({x:Math.random()*870,y:20});shots.forEach(s=>s.y-=9);enemies.forEach(e=>e.y+=2);
 ctx.fillStyle="#54e38a";ctx.fillRect(x-22,450,44,18);ctx.fillStyle="#ffe15a";shots.forEach(s=>ctx.fillRect(s.x,s.y,5,12));ctx.fillStyle="#ff5269";enemies.forEach(e=>ctx.fillRect(e.x,e.y,25,25))});
}
function basket(){
 buttonHint("Click to shoot baskets");
 let score=0;const hit=()=>score++;canvas.addEventListener("click",hit);cleanup=()=>canvas.removeEventListener("click",hit);
 loop(()=>{bg("#15223b");text("🏀",410,280,95);text("Baskets: "+score,350,70,30)});
}
function breakout(){
 buttonHint("A/D or ←/→ move the paddle • Space launches");
 let x=400,ball={x:450,y:400,vx:3,vy:-4},bricks=[];
 for(let r=0;r<4;r++)for(let q=0;q<10;q++)bricks.push({x:55+q*80,y:60+r*30,on:true});
 loop(()=>{bg();if(keys.a||keys.arrowleft)x-=7;if(keys.d||keys.arrowright)x+=7;x=Math.max(0,Math.min(820,x));ball.x+=ball.vx;ball.y+=ball.vy;
 if(ball.x<8||ball.x>892)ball.vx*=-1;if(ball.y<8)ball.vy*=-1;if(ball.y>485&&ball.x>x-50&&ball.x<x+50)ball.vy=-Math.abs(ball.vy);
 bricks.forEach(b=>{if(b.on&&ball.x>b.x&&ball.x<b.x+65&&ball.y>b.y&&ball.y<b.y+20){b.on=false;ball.vy*=-1}});
 ctx.fillStyle="#56dff0";ctx.fillRect(x,485,100,12);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,7);ctx.fill();
 bricks.forEach(b=>{if(b.on){ctx.fillStyle="#ff5bd8";ctx.fillRect(b.x,b.y,65,20)}});if(ball.y>520)ball={x:450,y:400,vx:3,vy:-4}});
}
function dodge(){
 buttonHint("A/D dodge the falling blocks");
 let x=440;
 loop(()=>{bg();if(keys.a)x-=7;if(keys.d)x+=7;ctx.fillStyle="#55def2";ctx.fillRect(x,455,40,25);
 for(let i=0;i<8;i++){ctx.fillStyle="#ff4d68";let ox=(i*127+Date.now()/5)%900,oy=(Date.now()/3+i*80)%520;ctx.fillRect(ox,oy,25,25)}});
}
function tunnel(){
 buttonHint("A/D or ←/→ stay inside the tunnel");
 let x=440;
 loop(()=>{bg("#060710");if(keys.a||keys.arrowleft)x-=6;if(keys.d||keys.arrowright)x+=6;x=Math.max(120,Math.min(760,x));
 ctx.strokeStyle="#58efff";ctx.lineWidth=5;for(let i=0;i<8;i++){let w=700-i*70,h=400-i*40;ctx.strokeRect(450-w/2,60+i*45,w,h)}
 ctx.fillStyle="#ff54dd";ctx.fillRect(x,455,25,35)});
}
function runner(){
 buttonHint("Space/W/↑ jumps");
 let y=420,v=0;
 loop(()=>{bg();if((keys[" "]||keys.w||keys.arrowup)&&y>=420){v=-11;keys[" "]=false}v+=.55;y+=v;if(y>420)y=420;
 ctx.fillStyle="#55d8ff";ctx.fillRect(0,460,900,60);ctx.fillStyle="#ffd34d";ctx.fillRect(100,y-35,32,35)});
}
function tank(){
 buttonHint("A/D move • Space fires");
 let x=450;
 loop(()=>{bg("#1b241b");if(keys.a)x-=5;if(keys.d)x+=5;ctx.fillStyle="#687c58";ctx.fillRect(x-28,430,56,30);ctx.strokeStyle="#eee";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x,430);ctx.lineTo(x,370);ctx.stroke()});
}

function memory(){buttonHint("Click two cards to match them");let a=[],open=[],moves=0;
for(let i=0;i<16;i++)a.push(Math.floor(i/2));a.sort(()=>Math.random()-.5);
const click=e=>{let r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/225),y=Math.floor((e.clientY-r.top)/130),i=y*4+x;if(i<0||i>=16||open.includes(i))return;open.push(i);if(open.length===2){moves++;setTimeout(()=>{if(a[open[0]]!==a[open[1]])open=[];else open=[]},500)}};
canvas.addEventListener("click",click);cleanup=()=>canvas.removeEventListener("click",click);
loop(()=>{bg("#10182d");for(let i=0;i<16;i++){let x=(i%4)*225,y=Math.floor(i/4)*130;ctx.fillStyle=open.includes(i)?"#54dff0":"#28365d";ctx.fillRect(x+8,y+8,209,114);if(open.includes(i)){text(String(a[i]+1),x+100,y+75,32)}}text("Moves: "+moves,20,35)})}
function game2048(){buttonHint("Arrow keys to slide • combine matching tiles");let b=Array(16).fill(0);b[0]=2;b[5]=2;
function add(){let z=b.map((v,i)=>v?i:null).filter(v=>v!==null);let e=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)b[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}
function move(dx,dy){let old=b.slice();let lines=[];if(dx){for(let y=0;y<4;y++)lines.push([0,1,2,3].map(x=>b[y*4+x]).filter(Boolean))}else{for(let x=0;x<4;x++)lines.push([0,1,2,3].map(y=>b[y*4+x]).filter(Boolean))}
lines=lines.map(a=>{let out=[];for(let i=0;i<a.length;i++){if(i<a.length-1&&a[i]===a[i+1]){out.push(a[i]*2);i++}else out.push(a[i])}while(out.length<4)out.push(0);return out});
if(dx){for(let y=0;y<4;y++){let l=dx>0?lines[y].slice().reverse():lines[y];if(dx>0)l.reverse();for(let x=0;x<4;x++)b[y*4+x]=l[x]}}else{for(let x=0;x<4;x++){let l=dy>0?lines[x].slice().reverse():lines[x];if(dy>0)l.reverse();for(let y=0;y<4;y++)b[y*4+x]=l[y]}}if(b.some((v,i)=>v!==old[i]))add()}
const k=e=>{if(e.key==="ArrowLeft")move(-1,0);if(e.key==="ArrowRight")move(1,0);if(e.key==="ArrowUp")move(0,-1);if(e.key==="ArrowDown")move(0,1)};window.addEventListener("keydown",k);cleanup=()=>window.removeEventListener("keydown",k);
loop(()=>{bg("#121826");for(let i=0;i<16;i++){let x=(i%4)*115+5,y=Math.floor(i/4)*115+5;ctx.fillStyle="#273452";ctx.fillRect(x,y,105,105);if(b[i])text(String(b[i]),x+35,y+65,30)}})}
function clickgame(){buttonHint("Click as fast as possible for 10 seconds");let n=0,end=Date.now()+10000;
const c=()=>{if(Date.now()<end)n++};canvas.addEventListener("click",c);cleanup=()=>canvas.removeEventListener("click",c);
loop(()=>{bg();let left=Math.max(0,end-Date.now());text("Clicks: "+n,350,230,36);text("Time: "+(left/1000).toFixed(1),370,280,28);if(!left)text("DONE!",410,340,36)})}
function avoider(){buttonHint("Move with A/D or ←/→");let x=450;
loop(()=>{bg();if(keys.a||keys.arrowleft)x-=6;if(keys.d||keys.arrowright)x+=6;x=Math.max(0,Math.min(860,x));ctx.fillStyle="#59e1ff";ctx.fillRect(x,455,40,25);for(let i=0;i<12;i++){let ox=(i*83+Date.now()/4)%900,oy=(i*97+Date.now()/5)%500;ctx.fillStyle="#ff5270";ctx.fillRect(ox,oy,25,25)}})}
function golf(){buttonHint("Click toward the hole to hit the ball");let x=150,y=400,shots=0;
const hit=e=>{let r=canvas.getBoundingClientRect();let tx=(e.clientX-r.left)/r.width*900,ty=(e.clientY-r.top)/r.height*520;x+=(tx-x)*.55;y+=(ty-y)*.55;shots++};canvas.addEventListener("click",hit);cleanup=()=>canvas.removeEventListener("click",hit);
loop(()=>{bg("#18552d");ctx.fillStyle="#ddd";ctx.beginPath();ctx.arc(780,100,22,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill();text("Shots: "+shots,20,35)})}
function pong(){buttonHint("PONG: W/S moves your paddle • bounce the ball past the opponent");let py=220,ey=220,bx=450,by=260,vx=5,vy=3;
const k=e=>{keys[e.key.toLowerCase()]=true};window.addEventListener("keydown",k);cleanup=()=>window.removeEventListener("keydown",k);
loop(()=>{bg();if(keys.w)py-=6;if(keys.s)py+=6;by+=vy;bx+=vx;if(by<0||by>510)vy*=-1;if(bx<45&&by>py&&by<py+90)vx=Math.abs(vx);if(bx>855&&by>ey&&by<ey+90)vx=-Math.abs(vx);ey+=(by-ey)*.04;ctx.fillStyle="#fff";ctx.fillRect(20,py,18,90);ctx.fillRect(862,ey,18,90);ctx.fillRect(bx,by,14,14);if(bx<0||bx>900){bx=450;by=260;vx*=-1}})}
function ttt(){buttonHint("Click a square • You are X");let b=Array(9).fill(""),turn="X";
const c=e=>{let r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/(r.width/3)),y=Math.floor((e.clientY-r.top)/(r.height/3)),i=y*3+x;if(!b[i]){b[i]=turn;turn=turn==="X"?"O":"X"}};canvas.addEventListener("click",c);cleanup=()=>canvas.removeEventListener("click",c);
loop(()=>{bg();ctx.strokeStyle="#fff";ctx.lineWidth=5;for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(i*300,0);ctx.lineTo(i*300,520);ctx.moveTo(0,i*173);ctx.lineTo(900,i*173);ctx.stroke()}b.forEach((v,i)=>v&&text(v,(i%3)*300+130,Math.floor(i/3)*173+105,70))})}
function color(){buttonHint("Click the matching color");let colors=["#ff4f6d","#55dfff","#ffd34d","#a86cff"],target=0,score=0;
const c=()=>{score++ ;target=Math.floor(Math.random()*4)};canvas.addEventListener("click",c);cleanup=()=>canvas.removeEventListener("click",c);
loop(()=>{bg();text("MATCH THIS",360,100,25);ctx.fillStyle=colors[target];ctx.fillRect(390,130,120,120);colors.forEach((co,i)=>{ctx.fillStyle=co;ctx.fillRect(130+i*170,350,100,100)});text("Score: "+score,20,35)})}
function heli(){buttonHint("Hold W/Space to rise • avoid the walls");let y=260,v=0;
loop(()=>{bg("#071c2a");if(keys.w||keys[" "])v-=.3;v+=.15;y+=v;ctx.fillStyle="#5be2ff";ctx.fillRect(150,y,35,20);for(let i=0;i<8;i++){let x=500+i*120-(Date.now()/4%120);let gap=120+(i%3)*40;ctx.fillStyle="#56a45c";ctx.fillRect(x,0,55,gap);ctx.fillRect(x,gap+130,55,520-gap-130)}})}
function catchgame(){buttonHint("Move with A/D and catch the coins");let x=430,score=0,coins=[];
loop(()=>{bg();if(keys.a)x-=6;if(keys.d)x+=6;if(Math.random()<.03)coins.push({x:Math.random()*880,y:0});coins.forEach(c=>c.y+=4);coins=coins.filter(c=>{if(c.y>440&&c.x>x-30&&c.x<x+70){score++;return false}return c.y<520});ctx.fillStyle="#59e0ff";ctx.fillRect(x,450,70,20);ctx.fillStyle="#ffd34d";coins.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,9,0,7);ctx.fill()});text("Score: "+score,20,35)})}
function reaction(){buttonHint("Wait for GREEN, then click");let state="wait",start=0,score="-";
const c=()=>{if(state==="go"){score=Date.now()-start;state="done"}else if(state==="done"){state="wait";score="-"}};canvas.addEventListener("click",c);cleanup=()=>canvas.removeEventListener("click",c);
setTimeout(()=>{state="go";start=Date.now()},1500+Math.random()*2500);loop(()=>{bg();ctx.fillStyle=state==="go"?"#45dc72":state==="done"?"#55dfff":"#ff536d";ctx.beginPath();ctx.arc(450,260,100,0,7);ctx.fill();text(state==="go"?"CLICK!":state==="done"?score+" ms":"WAIT...",350,270,28)})}

function bubble(){
 buttonHint("Click to pop bubbles");
 let pops=0;const hit=()=>pops++;canvas.addEventListener("click",hit);cleanup=()=>canvas.removeEventListener("click",hit);
 loop(()=>{bg("#08182b");for(let i=0;i<18;i++){ctx.fillStyle=["#ff5b7d","#59dfff","#ffd34d","#a875ff"][i%4];ctx.beginPath();ctx.arc(60+(i*97)%820,70+(i*63)%390,23,0,7);ctx.fill()}text("Pops: "+pops,20,35)});
}
</script></body></html>
